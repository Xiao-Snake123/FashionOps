[project]
name = "office-mcp"
version = "0.1.0"
description = "办公自动化 MCP 服务器集合：文档处理 / 邮件 / 日历，供 Agent 通过 Model Context Protocol 调用"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "markdown-it-py>=3.0",
    "structlog>=24.1",
    "icalendar>=6.0",
    # Windows 没有系统时区库，zoneinfo 需要 tzdata 才能解析 Asia/Shanghai
    "tzdata>=2024.1",
]

[project.optional-dependencies]
email = []
calendar = ["caldav>=1.4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
office-mcp-docs = "office_mcp.docs.server:main"
office-mcp-email = "office_mcp.email.server:main"
office-mcp-calendar = "office_mcp.calendar.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/office_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
