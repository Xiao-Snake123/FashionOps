# ============================================================================
# 服装电商多 Agent 运营中台 —— Redis 配置（本地开发）
# ============================================================================
# 用途：
#   1. 任务图会话状态缓存（LangGraph 的 Redis checkpointer / Store）
#   2. 工具网关的限流计数器、熔断状态
#   3. Agent 之间的短期消息传递
#
# 启动方式见 deploy/scripts/start-services.ps1
# ============================================================================

# ---- 网络 ----
# 只监听回环地址：本机开发不需要对外暴露，也更安全
bind 127.0.0.1
port 6379
protected-mode yes

# ---- 持久化 ----
# 必须开启 AOF：任务状态要能在进程崩溃后恢复，
# 这正是「任务中断可恢复」这个技术点的存储基础。
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# RDB 快照作为二级备份
save 900 1
save 300 10
save 60 10000

# 数据目录：相对 redis-server 的工作目录（D:\develop\redis），即 D:\develop\redis\data
#
# 【踩坑】Windows 版 Redis 是 msys2 编译的 Unix 程序，只把以 "/" 开头的路径当作绝对路径。
# 写成 dir "D:/develop/data/redis" 会被当成相对路径，拼到 cwd 后面变成
# /develop/redis/D:/develop/data/redis 而报错。因此这里必须用相对路径。
dir ./data

# ---- 内存 ----
maxmemory 512mb
# 用 LRU 淘汰：缓存性质的限流计数丢了可以重建，任务状态在 AOF 里
maxmemory-policy allkeys-lru

# ---- 日志 ----
loglevel notice
# 留空 = 输出到控制台，由启动脚本重定向写入 D:\develop\logs\redis.log
# （同样因为路径相对化问题，不在这里写绝对路径）
logfile ""

# ---- 数据库数量 ----
# 用不同 db 隔离：0=任务状态 1=限流计数 2=缓存
databases 16

# ---- 慢查询 ----
slowlog-log-slower-than 10000
slowlog-max-len 128
