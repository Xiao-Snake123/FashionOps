# Alembic configuration.
#
# ---------------------------------------------------------------------------
# NOTE FOR MAINTAINERS: keep this file ASCII-ONLY.
#
# Alembic reads this ini with `encoding="locale"`, and on a Windows machine
# with a CJK locale that means GBK. Any non-ASCII byte here (Chinese comment,
# smart quote, emoji) makes the CLI die with:
#
#     UnicodeDecodeError: 'gbk' codec can't decode byte 0x82 ...
#
# Setting PYTHONUTF8=1 does NOT help: configparser resolves "locale" through
# locale.getencoding(), which still returns GBK under UTF-8 mode.
#
# We deliberately do NOT put `sqlalchemy.url` here either:
#   1. this file is committed, database passwords must not be;
#   2. even for local convenience, configparser's `%` interpolation breaks
#      passwords containing `%` -- and randomly generated ones often do.
#
# The real connection string comes from the project's own `Settings` object
# in `migrations/env.py`, so migrations and the app always point at the SAME
# database. See `migrations/README.md` (UTF-8, Chinese) for the long version.
# ---------------------------------------------------------------------------
#
# Common commands (run from platform/):
#   .venv\Scripts\alembic.exe upgrade head
#   .venv\Scripts\alembic.exe revision --autogenerate -m "add xyz table"
#   .venv\Scripts\alembic.exe downgrade -1
#   .venv\Scripts\alembic.exe current
#   .venv\Scripts\alembic.exe history --verbose

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Timestamp-prefixed filenames so lexical order == execution order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
